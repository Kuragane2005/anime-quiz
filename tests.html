<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тести — Anime Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SZ0N5MXX12"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-SZ0N5MXX12');
</script>
  <style>
    .wrap{ width:min(980px,94%); margin: 16px auto 40px; }
    .card{
      background: rgba(15,15,25,.82);
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      padding:18px;
      box-shadow: 0 0 30px rgba(255,0,140,.18);
      backdrop-filter: blur(10px);
    }
    h1{ margin:0 0 8px; font-size:40px; letter-spacing:2px; }
    p{ margin:0 0 14px; font-family: Arial, sans-serif; opacity:.85; }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      margin-top: 12px;
    }
    .test{
      display:flex; justify-content:space-between; align-items:center;
      gap:12px;
      padding:14px;
      border-radius:18px;
      background: rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.10);
      text-decoration:none;
      color:#fff;
      font-family: Arial, sans-serif;
      transition: transform .12s ease;
    }
    .test:hover{ transform: scale(1.01); }
    .tag{ opacity:.8; font-size:13px; }
    .go{
      padding:10px 12px;
      border-radius:14px;
      background: linear-gradient(90deg,#ff2f92,#7a3cff);
      font-weight:700;
      font-size:13px;
    }
    @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
  </style>
</head>
  <script>
  const params = new URLSearchParams(location.search);
  const diff = params.get("diff") || "easy";

  // міняємо заголовок
  const h1 = document.querySelector("h1");
  if (h1) h1.textContent = `🧠 Тести (${diff.toUpperCase()})`;

  // додаємо diff до всіх кнопок старту
  document.querySelectorAll('a[href^="quiz.html"]').forEach(a => {
    const url = new URL(a.href);
    url.searchParams.set("diff", diff);
    a.href = url.pathname + "?" + url.searchParams.toString();
  });
  </script>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🔥 ANIME HUB</a>
    <nav class="nav">
      <a class="active" href="tests.html">Тести</a>
      <a href="openings.html">Опенінги</a>
      <a href="leaders.html">Лідери</a>
      <a href="ranks.html">Ранги</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>🧠 Тести (Easy)</h1>
      <p>Обирай аніме і проходь легкий тест. (5 питань)</p>

      <div class="grid">
        <a class="test" href="quiz.html?mode=naruto">
          <div>
            <b>Naruto</b><div class="tag">Easy • 5 питань</div>
          </div>
          <div class="go">Старт</div>
        </a>

        <a class="test" href="quiz.html?mode=hunter">
          <div>
            <b>Hunter x Hunter</b><div class="tag">Easy • 5 питань</div>
          </div>
          <div class="go">Старт</div>
        </a>

        <a class="test" href="quiz.html?mode=bleach">
          <div>
            <b>Bleach</b><div class="tag">Easy • 5 питань</div>
          </div>
          <div class="go">Старт</div>
        </a>

        <a class="test" href="quiz.html?mode=sao">
          <div>
            <b>Sword Art Online</b><div class="tag">Easy • 5 питань</div>
          </div>
          <div class="go">Старт</div>
        </a>

        <a class="test" href="quiz.html?mode=mha">
          <div>
            <b>My Hero Academia</b><div class="tag">Easy • 5 питань</div>
          </div>
          <div class="go">Старт</div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
