<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лідери — Anime Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <!-- якщо в тебе є base.css — залишай -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="leaders.css">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SZ0N5MXX12"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-SZ0N5MXX12');
</script>
</head>

<body>
  <div class="bg"></div>
  <div class="stars"></div>

  <main class="page">
    <!-- TOP NAV CARD (як на скріні) -->
    <header class="topcard">
      <div class="topbrand">🔥 ANIME HUB</div>

      <nav class="topnav">
        <a class="pill" href="tests.html">Тести</a>
        <a class="pill" href="openings.html">Опенінги</a>
        <a class="pill active" href="leaders.html">Лідери</a>
        <a class="pill" href="ranks.html">Ранги</a>
      </nav>

      <div class="topsub">Топ гравців за XP — скоро буде онлайн-таблиця</div>
    </header>

    <!-- MAIN CARD -->
    <section class="card">
      <div class="head">
        <div class="hicon">🏆</div>
        <div>
          <h1>Таблиця лідерів</h1>
          <p>Топ гравців за XP і результатами тестів</p>
        </div>

        <div class="filters">
          <select id="period">
            <option value="all">За весь час</option>
            <option value="14">Останні 14 днів (демо)</option>
            <option value="7">Останні 7 днів (демо)</option>
          </select>

          <select id="sort">
            <option value="xp">Сортувати: XP</option>
            <option value="wins">Сортувати: W</option>
            <option value="tests">Сортувати: Тести</option>
          </select>
        </div>
      </div>

      <!-- TOP 3 -->
      <div id="top3" class="top3"></div>

      <!-- TABLE -->
      <div class="table">
        <div class="thead">
          <div>#</div>
          <div>Гравець</div>
          <div class="right">Ранг</div>
          <div class="right">XP</div>
          <div class="right">Тести</div>
          <div class="right">W</div>
        </div>
        <div id="rows" class="tbody"></div>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <button id="demoBtn" class="btn ghost">Заповнити демо</button>
        <button id="clearBtn" class="btn">Очистити</button>
      </div>

      <!-- FOOTER BUTTONS -->
      <div class="footer">
        <a class="btn ghost" href="index.html">← На головну</a>
        <a class="btn" href="tests.html">▶ Грати тести</a>
      </div>

      <div class="hint">Порада: за 1 тест ти отримуєш XP. Чим більше серія — тим вищий ранг 😈</div>
    </section>
  </main>

  <script src="leaders.js"></script>
</body>
</html>
